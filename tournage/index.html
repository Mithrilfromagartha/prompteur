<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Tournage"><meta name="theme-color" content="#04121c"><style>[hidden]{display:none!important}</style></head><body><title>Tournage de la semaine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Archivo+Narrow:wght@500;700&display=swap">
<style>
  /* Liste de plateau : un onglet par compte, une ligne par prise à faire avec sa case ; le prompteur s'ouvre par-dessus, plein écran. Un seul thème sombre, voulu (lisible sur un iPhone posé sur le plateau, comme le prompteur Sauvons Les). */
  :root {
    --fond:#04121c; --panneau:#0b2433; --panneau2:#0f2d3f; --filet:#1d4255; --texte:#f4f7f8; --discret:#8fb0bd;
    --dit:#4f6f7c; --accent:#78e6dc; --fait:#7fd99a; --alerte:#ffb15c;
    --lecture:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
    --etiquette:"Archivo Narrow","Arial Narrow","Segoe UI",sans-serif;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--fond); color:var(--texte); font-family:var(--lecture); -webkit-text-size-adjust:100%; }
  body { font-size:16px; line-height:1.45; }
  button { font:inherit; color:inherit; cursor:pointer; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }

  #liste { max-width:760px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:18px 48px; display:flex; flex-direction:column; gap:18px; }
  .tete { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:26px; line-height:1.15; text-wrap:balance; }
  .total { font-family:var(--etiquette); color:var(--discret); font-variant-numeric:tabular-nums; letter-spacing:.03em; }
  .barre { height:6px; border-radius:3px; background:var(--panneau); overflow:hidden; }
  .barre i { display:block; height:100%; background:var(--fait); width:0; }
  @media (prefers-reduced-motion:no-preference) { .barre i { transition:width .3s; } }
  #sync { font-size:13px; color:var(--discret); min-height:1.2em; }
  #sync.alerte { color:var(--alerte); }

  #onglets { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
  .onglet { min-height:64px; padding:8px 10px; border:1px solid var(--filet); border-radius:10px; background:var(--panneau); text-align:left; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .onglet b { font-size:15px; overflow-wrap:anywhere; }
  .onglet span { font-family:var(--etiquette); font-size:13px; color:var(--discret); font-variant-numeric:tabular-nums; }
  .onglet[aria-selected="true"] { border-color:var(--accent); background:var(--panneau2); }
  .onglet[aria-selected="true"] b { color:var(--accent); }
  .onglet.complet span { color:var(--fait); }

  .sous { margin:0; color:var(--discret); }
  details.conseils { border:1px solid var(--filet); border-radius:10px; padding:10px 14px; background:var(--panneau); }
  details.conseils summary { cursor:pointer; font-family:var(--etiquette); font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:13px; color:var(--accent); }
  details.conseils ul { margin:10px 0 2px; padding-left:1.1em; display:flex; flex-direction:column; gap:6px; }

  .groupe { margin:6px 0 -6px; font-family:var(--etiquette); font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:13px; color:var(--discret); }
  .elements { display:flex; flex-direction:column; gap:10px; }
  .el { display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; padding:12px; border-top:1px solid var(--filet); }
  .el:first-child { border-top:0; }
  .case { width:44px; height:44px; border-radius:10px; border:2px solid var(--filet); background:transparent; display:grid; place-items:center; font-size:24px; font-weight:700; color:var(--fond); }
  .case[aria-pressed="true"] { background:var(--fait); border-color:var(--fait); }
  .corps { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .titre { font-weight:700; font-size:17px; text-wrap:balance; }
  .el.fait .titre { color:var(--discret); text-decoration:line-through; text-decoration-color:var(--dit); }
  .meta { font-family:var(--etiquette); font-size:13px; color:var(--discret); letter-spacing:.03em; font-variant-numeric:tabular-nums; }
  .info { margin:0; color:var(--texte); opacity:.88; }
  .note { margin:0; color:var(--alerte); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .lire { min-height:42px; padding:0 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--fond); font-weight:700; }
  .apercu { min-height:42px; padding:0 14px; border-radius:8px; border:1px solid var(--filet); background:var(--panneau); }
  .texte-entier { margin:0; padding:10px 12px; border-left:3px solid var(--filet); color:var(--discret); }
  .texte-entier mark { background:none; color:var(--accent); font-family:var(--etiquette); font-size:12px; letter-spacing:.05em; margin-right:.4em; }

  /* Prompteur : plein écran par-dessus la liste. */
  #prompteur { position:fixed; inset:0; z-index:5; background:var(--fond); display:flex; flex-direction:column;
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
    padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
  #prompteur[hidden] { display:none; }
  #haut { display:flex; align-items:center; gap:8px; padding-block:6px; font-size:15px; flex-wrap:wrap; }
  #haut button { min-height:40px; padding:0 12px; border:1px solid var(--filet); border-radius:8px; background:var(--panneau); }
  #ptitre { flex:1 1 10em; min-width:0; color:var(--discret); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #compte, #taille { color:var(--discret); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #taille { min-width:3.2em; text-align:center; }
  #scene { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:.5em; cursor:pointer; user-select:none; -webkit-user-select:none; padding-block:4px 10px; }
  #jeu { font-family:var(--etiquette); font-weight:700; letter-spacing:.06em; color:var(--alerte); font-size:clamp(14px, 3.4vh, 22px); min-height:1.2em; }
  #morceau { font-weight:700; line-height:1.18; text-wrap:balance; overflow-wrap:break-word; }
  #morceau .dit { color:var(--dit); }
  #haut #go { background:var(--accent); border-color:var(--accent); color:var(--fond); font-weight:700; }
  #etat { flex-basis:100%; color:var(--discret); font-size:13px; min-height:1.2em; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #etat.alerte { color:var(--alerte); }
  /* Micro actif : la barre disparaît pour laisser toute la place au texte ; un petit bouton reste pour arrêter. */
  body.joue #haut { display:none; }
  #stop { position:fixed; top:calc(6px + env(safe-area-inset-top, 0px)); right:max(10px, env(safe-area-inset-right, 0px)); min-height:34px; padding:0 10px; opacity:.45; font-size:14px; z-index:6; border:1px solid var(--filet); border-radius:8px; background:var(--panneau); }
  body:not(.joue) #stop { display:none; }
  #suite { color:var(--discret); font-size:clamp(14px, 3.2vh, 22px); line-height:1.3; }
  #suite b { color:var(--accent); font-weight:700; letter-spacing:.05em; font-size:.8em; margin-right:.5em; }
  #fin { display:flex; flex-direction:column; gap:14px; align-items:flex-start; }
  #fin p { margin:0; font-weight:700; font-size:clamp(22px, 6vh, 44px); color:var(--accent); }
  #fin .actions button { min-height:52px; padding:0 20px; font-size:18px; border-radius:10px; border:1px solid var(--filet); background:var(--panneau); }
  #fin .actions .marquer { background:var(--fait); border-color:var(--fait); color:var(--fond); font-weight:700; }
  body.sans-suite #suite { display:none; }
  body.prompteur-ouvert { overflow:hidden; }
</style>

  <div class="tete">
    <h1>Tournage de la semaine</h1>

<script>
const COMPTES = [{"id": "sauvons-les", "nom": "Sauvons Les", "sous": "Shorts face caméra · série du 2 décembre", "conseils": ["Filme plus large, en 4K : je recadre au montage (ta tête en bas de l'image, comme Abrège).", "Lumière de face. Garde le fichier d'origine du téléphone, pas un envoi par WhatsApp.", "Les mots « mort », « tuer »… : dis-les normalement, le montage les bipe."], "items": [{"id": "sl-1", "type": "texte", "titre": "Les orques d'Antibes (pilote)", "morceaux": [{"t": "Ces deux orques vivent seules dans un parc fermé depuis presque deux ans."}, {"t": "Et leur voisin, le dauphin Rocky, est mort cet automne, moins de trois mois après son départ en Espagne."}, {"t": "Oui frérot, le Marineland d'Antibes a fermé, mais la maman et son fils sont restés là."}, {"t": "Et téma le plan drone, de l'eau verte, de la rouille partout, on dirait The Last of Us."}, {"t": "Mais le pire, c'est que le gouvernement veut les envoyer en Espagne, dans un parc qui fait encore des spectacles."}, {"t": "Abonne-toi, à mille abonnés je partage la pétition qui demande un sanctuaire pour elles, pas un autre bassin."}, {"t": "Parce que finir leur vie en spectacle, franchement, tu trouves ça normal ?"}], "info": "Une seule prise, face caméra, d'une traite.", "note": ""}, {"id": "sl-2", "type": "texte", "titre": "Ce qui change le 2 décembre", "morceaux": [{"t": "Le 2 décembre, en France, garder un dauphin dans un bassin, ce sera interdit, sauf qu'il y a un piège, genre « It's a trap »."}, {"t": "Et ouais frérot, c'est une vraie loi, votée il y a cinq ans, et elle dit stop aux spectacles et stop aux bébés nés en bassin."}, {"t": "Du coup, les parcs ont eu cinq ans pour trouver une solution."}, {"t": "Sauf que le jour arrive, et y a deux orques à Antibes et onze dauphins près de Nantes qui savent pas où ils vont finir."}, {"t": "Et le piège, je te le montre lundi."}, {"t": "Abonne-toi, à mille abonnés je partage la pétition qui demande un sanctuaire pour ces orques et ces dauphins."}, {"t": "Parce qu'une loi avec un piège dedans, tu lui fais confiance, toi ?"}], "info": "Une seule prise, face caméra, d'une traite.", "note": "« Et le piège, je te le montre lundi » : dis le jour où sortira la vidéo du piège (« demain » si elle sort le lendemain)."}, {"id": "sl-3", "type": "texte", "titre": "Les 11 dauphins près de Nantes", "morceaux": [{"t": "Ces onze dauphins devaient déménager, et maintenant, ils ont plus nulle part où aller, comme Tom Hanks dans Le Terminal."}, {"t": "Ils vivent dans un parc près de Nantes, et comme la loi arrive, le zoo de Beauval avait promis de les prendre."}, {"t": "Sauf que fin août, Beauval a lâché l'affaire, parce que ça coûtait beaucoup trop cher."}, {"t": "Du coup, retour à la case départ."}, {"t": "Et le pire, c'est qu'une asso dit qu'ils vont finir à l'autre bout du monde, en Asie, sauf que pour l'instant, rien n'est confirmé."}, {"t": "Si t'as le seum, abonne-toi, à mille abonnés on partage la pétition qui veut les envoyer dans un sanctuaire en Italie."}, {"t": "Et toi, plutôt l'Asie ou un sanctuaire, tu les enverrais où ?"}], "info": "Une seule prise, face caméra, d'une traite.", "note": ""}, {"id": "sl-4", "type": "texte", "titre": "Le piège de la science", "morceaux": [{"t": "Comme promis, la loi qui interdit les dauphins en bassin a un piège, et ce piège, c'est la science."}, {"t": "Si un parc dit qu'il fait de la recherche, il a le droit de garder ses dauphins et même de leur faire faire des bébés, comme une carte sortie de prison."}, {"t": "Sauf que personne a encore écrit ce que c'est, de la vraie recherche."}, {"t": "Et le pire, c'est que le parc près de Nantes, avec ses onze dauphins, disait en 2023 que c'était son cas."}, {"t": "Abonne-toi, à mille abonnés je partage la pétition qui demande un sanctuaire pour ces dauphins, pas un bassin."}, {"t": "Alors pour toi, ces recherches, c'est de la vraie science ou une grosse excuse ?"}], "info": "Une seule prise, face caméra, d'une traite.", "note": ""}, {"id": "sl-5", "type": "texte", "titre": "Rocky, transféré de nuit", "morceaux": [{"t": "Ce dauphin est parti en pleine nuit, et moins de trois mois après, il était mort."}, {"t": "Il s'appelait Rocky, comme le boxeur, il avait vingt-neuf ans, et il vivait à Antibes, dans un parc fermé."}, {"t": "Du coup, en juillet, on l'a mis dans un camion puis dans un avion pour l'Espagne, avec sept autres dauphins, en plein été."}, {"t": "Sauf qu'une asso avait prévenu qu'un voyage comme ça, l'été, ça peut tuer."}, {"t": "Et en octobre, Rocky meurt, et depuis, aucune explication, silence radio."}, {"t": "Si ça te met la rage, abonne-toi, à mille abonnés je mets en bio la pétition qui demande plus aucun transfert vers un parc."}, {"t": "Et pour Rocky, tu penses que quelqu'un doit payer ?"}], "info": "Une seule prise, face caméra, d'une traite.", "note": ""}, {"id": "sl-6", "type": "texte", "titre": "Le parc de Tenerife", "morceaux": [{"t": "Le gouvernement veut envoyer nos deux dernières orques dans un parc où quatre orques sont mortes en quatre ans."}, {"t": "Elles s'appellent Wikie et Keijo, une maman et son fils, et elles sont toutes seules dans un parc fermé."}, {"t": "Ce nouveau parc, il est à Tenerife, en Espagne, et là-bas, téma, y a encore des spectacles d'orques, genre Free Willy à l'envers."}, {"t": "Et le plus fou, c'est que les scientifiques espagnols avaient déjà dit non, à cause des bassins trop petits."}, {"t": "Et pourtant, le ministre dit que c'est la meilleure solution."}, {"t": "Chaque abonné compte, à mille abonnés je mets en bio la pétition contre leur départ en Espagne."}, {"t": "Et toi, si t'étais ministre, tu les envoies à Tenerife, oui ou non ?"}], "info": "Une seule prise, face caméra, d'une traite.", "note": ""}]}, {"id": "plan-culte", "nom": "Plan Culte", "sous": "Pilote · « t'as forcément plus de 35 ans »", "conseils": ["Vertical 9:16, en 4K si possible, objectif à hauteur des yeux, regard dans l'objectif.", "Tenue différente de celle d'Ezra : les deux chaînes ne doivent pas se ressembler.", "Lumière face à toi, pièce calme, micro près de la bouche. Si tu butes : 1 s de silence, puis la phrase entière."], "items": [{"id": "pc-taram", "type": "texte", "titre": "Pilote · Taram et le Chaudron magique", "morceaux": [{"t": "T'as forcément plus de 35 ans si tu connais Taram et le Chaudron magique.", "jeu": "VISAGE · direct, petit sourire de défi"}, {"t": "Et je sais de quoi je parle : je suis né en juillet 1807, le jour où Napoléon s'est fait attaquer par des lapins.", "jeu": "VISAGE · pince-sans-rire, très sérieux, sans sourire"}, {"t": "Et si tu l'as vu au cinéma, t'as vu un Disney charcuté avant sa sortie, parce qu'il faisait trop peur."}, {"t": "Faut dire que le méchant, c'est le Seigneur des Ténèbres, un squelette à cornes, genre le cousin de Skeletor dans Musclor."}, {"t": "Et lui, il veut réveiller une armée de morts avec un chaudron magique."}, {"t": "Du coup, quand le studio le projette en test, l'armée des morts est trop dure pour les enfants dans la salle."}, {"t": "Alors le nouveau patron du studio, Jeffrey Katzenberg, ordonne de couper, et il se met même à monter le film tout seul, jusqu'à ce que son boss, Michael Eisner, l'arrête."}, {"t": "Au final, une dizaine de minutes disparaissent, dont des morceaux de la scène où l'armée des morts sort du chaudron."}, {"t": "Et même charcuté, ça reste le premier dessin animé Disney classé « accord parental conseillé » aux États-Unis.", "jeu": "VISAGE · un peu fier du film, comme si tu le défendais"}, {"t": "Et en France, plus de trois millions d'entrées."}, {"t": "Mais aux États-Unis, c'est un flop, battu même par Les Bisounours, le film."}, {"t": "À cette époque, chez Disney, les patrons parlent même de fermer le département animation."}, {"t": "Et tu sais quoi ?", "jeu": "VISAGE · tu te penches vers l'objectif, la question monte"}, {"t": "Les coupes sont tellement mal faites qu'on les entend encore : la musique saute, et une cymbale s'arrête net, en plein coup."}, {"t": "Écoute.", "jeu": "puis 3 secondes de silence complet"}, {"t": "Et moi, franchement, je le trouve encore magnifique."}, {"t": "Il t'avait fait peur, le Seigneur des Ténèbres ?", "jeu": "VISAGE · question franche, attends 1 s avant de couper"}], "info": "Tout le texte d'une traite, 2 ou 3 prises complètes. Clap des mains au début de chaque prise.", "note": "À la fin de chaque prise : redis 3 fois de suite l'accroche « T'as forcément plus de 35 ans… »."}, {"id": "pc-film", "type": "plan", "titre": "Me donner le fichier du film", "info": "Ta copie de Taram (Disney+ ou DVD) : je cherche le moment où la musique saute et la cymbale coupée. Si on ne l'entend pas clairement, on change la fin avant le montage."}]}, {"id": "ezra", "nom": "Ezra explique", "sous": "Pilote façon Zheng · le point bleu de Maps", "conseils": ["Vertical 9:16, 4K 30 i/s, caméra ×1, sur pied à hauteur des yeux, à 1 m - 1,5 m.", "Cadre de la taille à la tête, le haut de ta tête vers 35-40 % de la hauteur (de la place au-dessus pour la 3D).", "Lumière douce de face, fond simple qui ne se confond pas avec tes cheveux, exposition verrouillée (appui long), pas de zoom.", "Les rushs : envoie-les-moi tels quels, sans les renommer, je trie."], "items": [{"id": "ez-essai", "type": "plan", "titre": "D'abord : l'essai de 10 s et la photo de profil", "info": "10 s face caméra sur n'importe quelle phrase du texte (je te détoure pour vérifier le rendu), puis 2 s sans parler, regard dans l'objectif, bouche fermée ou léger sourire : ce sera la vraie photo de profil."}, {"id": "ez-maps", "type": "texte", "titre": "Pilote · Ton point bleu sur Maps", "morceaux": [{"t": "Ton point bleu sur Maps, c'est Einstein qui le place.", "jeu": "FACE CAMÉRA"}, {"t": "En ce moment, au moins quatre satellites, à plus de vingt mille kilomètres au-dessus de ta tête, t'envoient l'heure exacte."}, {"t": "Et pour que cette heure tombe juste, il faut les calculs d'Einstein."}, {"t": "La plupart des gens croient que leur téléphone envoie sa position aux satellites.", "jeu": "FACE CAMÉRA"}, {"t": "Mais pour se repérer, il ne leur envoie rien du tout : il se contente d'écouter.", "jeu": "FACE CAMÉRA"}, {"t": "Si l'un des satellites est pile au-dessus de toi, son signal met soixante-sept millisecondes à arriver dans ta main, même pas un dixième de seconde."}, {"t": "Alors on va ralentir ces soixante-sept millisecondes."}, {"t": "Chaque satellite file à quatorze mille kilomètres-heure, avec à bord une horloge atomique, bien plus précise que n'importe quelle montre."}, {"t": "En boucle, il répète la même phrase : je suis ici, et il est exactement telle heure."}, {"t": "Ce message part vers toi à la vitesse de la lumière, il traverse l'air, les nuages, puis il entre dans ton téléphone."}, {"t": "Ton téléphone lit alors l'heure écrite dans le message et la compare à l'heure d'arrivée."}, {"t": "Comme le message voyage à la vitesse de la lumière, ce petit retard lui donne sa distance au satellite."}, {"t": "Sauf qu'avec une seule distance, tu pourrais être n'importe où sur une sphère géante autour du satellite.", "jeu": "FACE CAMÉRA"}, {"t": "En plus, l'horloge de ton téléphone est bien moins précise que celles de l'espace, donc la moindre erreur d'heure fausse sa distance.", "jeu": "FACE CAMÉRA"}, {"t": "Du coup, ton téléphone écoute au moins quatre satellites en même temps, et avec toutes ces distances, il calcule à la fois ta position et l'heure exacte."}, {"t": "Mais il y a un problème.", "jeu": "FACE CAMÉRA"}, {"t": "Là-haut, le temps ne passe pas à la même vitesse qu'ici.", "jeu": "FACE CAMÉRA"}, {"t": "D'abord, les satellites vont tellement vite que leurs horloges prennent du retard : sept microsecondes, des millionièmes de seconde, chaque jour, comme Einstein l'avait prédit."}, {"t": "Ensuite, plus on s'éloigne de la Terre, plus le temps passe vite, ce qui leur donne quarante-cinq microsecondes d'avance par jour."}, {"t": "Résultat : les horloges des satellites prennent trente-huit microsecondes d'avance chaque jour."}, {"t": "Ça a l'air de rien, sauf qu'en une seule microseconde, le signal parcourt trois cents mètres."}, {"t": "Donc si personne ne corrigeait ça, les distances mesurées seraient fausses de plus de onze kilomètres dès le premier jour."}, {"t": "C'est pour ça que les ingénieurs règlent le signal des satellites un tout petit peu plus lent, pour que, vu d'ici, il tombe pile.", "jeu": "FACE CAMÉRA"}, {"t": "Et comme même une horloge atomique dérive un peu, des stations au sol surveillent les horloges des satellites et leur envoient des corrections chaque jour.", "jeu": "FACE CAMÉRA"}, {"t": "Même ton téléphone fait sa part : pour chaque satellite, il refait lui-même un petit calcul de relativité."}, {"t": "Alors la prochaine fois que Maps te dit de tourner à gauche, pense à tout ça : ton téléphone vient d'écouter au moins quatre satellites, de chronométrer leurs signaux et de croiser leurs distances, avec des horloges corrigées grâce à Einstein.", "jeu": "FACE CAMÉRA · téléphone en main"}, {"t": "Tout ça pour placer ce petit point bleu.", "jeu": "FACE CAMÉRA · téléphone en main"}], "info": "Phrase par phrase, 2 prises de chaque, regard dans l'objectif. Téléphone avec Maps ouvert dans la main. Si un mot accroche : reprends la phrase entière."}, {"id": "ez-avion", "type": "plan", "titre": "Maps en mode avion, dehors", "groupe": "Indispensable", "info": "Dehors, mode avion et Wi-Fi coupé, ouvre Maps, attends le point bleu, lance l'enregistrement d'écran (centre de contrôle). 10-15 s en faisant quelques pas pour que le point bouge."}, {"id": "ez-cligne", "type": "plan", "titre": "Ton clignement au ralenti", "groupe": "Indispensable", "info": "Mode Ralenti (Réglages > Appareil photo > Enregistrer au ralenti > 1080p à 240 i/s), visage en gros plan, tu regardes l'objectif et tu clignes 2-3 fois normalement."}, {"id": "ez-epaule", "type": "plan", "titre": "Ta main avec le téléphone, par-dessus l'épaule", "groupe": "Indispensable", "info": "Maps ouvert, filmé par-dessus ton épaule, 5 s, l'écran bien visible."}, {"id": "ez-gauche", "type": "plan", "titre": "Une marche où tu tournes à gauche", "groupe": "Indispensable", "info": "Téléphone en main, 5-8 s, filmé de dos ou de trois quarts."}, {"id": "ez-pied", "type": "plan", "titre": "Toi en pied, immobile, téléphone en main", "groupe": "Si tu as le temps", "info": "5 s : je te duplique pour montrer « tu pourrais être n'importe où sur une sphère »."}, {"id": "ez-tournevis", "type": "plan", "titre": "Le geste du tournevis d'horloger", "groupe": "Si tu as le temps", "info": "Gros plan sur tes mains : une montre dans une main, un petit tournevis (ou un stylo) dans l'autre, tu fais semblant de la régler. 3-5 s."}]}, {"id": "emerveillement", "nom": "L'Émerveillement", "sous": "Épisode 3 · Göbekli Tépé, le dossier (conducteur v3, avec le mage)", "conseils": ["Ordre : face caméra en horizontal, puis la voix off au même micro et au même endroit, puis les Reels en vertical.", "Horizontal 16:9, en 4K. Un cran d'énergie au-dessus du naturel face caméra ; ton de conteur en voix off.", "Aux blancs marqués (1,5 à 2 s), tu t'arrêtes : le mage parle là. Sans le mage, on coupe le blanc.", "Si tu butes : reprends la phrase entière. La voix de Merer, c'est moi qui la fais (Fish)."], "items": [{"id": "em3-cam-1", "type": "texte", "titre": "1. Ouverture", "morceaux": [{"t": "Il y a plus de temps entre ces piliers et la Grande Pyramide qu'entre la Grande Pyramide et toi.", "jeu": "DÉTOURÉ · cadre large, fond simple · puis blanc de 1,5 s (le mage : « Attends, quoi ? »)"}], "groupe": "Face caméra (horizontal)", "info": "Détouré au montage devant les piliers : cadre large, fond le plus simple possible, énergie franche dès le premier mot."}, {"id": "em3-cam-2", "type": "texte", "titre": "2. Le duel", "morceaux": [{"t": "Alors, qui a bien pu dresser ces piliers ?"}, {"t": "Là-dessus, deux camps s'affrontent, et à la fin de cette vidéo, c'est toi qui vas trancher."}, {"t": "D'un côté, il y a Graham Hancock, un écrivain britannique qui écrit sur le sujet depuis trente ans, et qui a même sa série sur Netflix."}, {"t": "Et lui, il défend une idée assez simple : des chasseurs-cueilleurs n'ont pas pu faire ça tout seuls, donc quelqu'un leur a appris, et ce quelqu'un, ce seraient les survivants d'une civilisation disparue.", "jeu": "puis blanc de 2 s (le mage : « Une civilisation disparue ? Moi, j'adore déjà. »)"}, {"t": "Puis en face, il y a les archéologues qui fouillent ces sites."}, {"t": "Et en 2024, les deux camps se sont même retrouvés face à face chez Joe Rogan, pendant des heures."}], "groupe": "Face caméra (horizontal)", "info": "D'une traite. Aux blancs marqués, tu t'arrêtes le temps indiqué : le mage parle là."}, {"id": "em3-cam-3", "type": "texte", "titre": "3. La règle du jeu", "morceaux": [{"t": "Alors nous, on va faire une chose simple : on va ouvrir le dossier ensemble, indice par indice."}, {"t": "Dedans, il y a un carnet de bord vieux de quatre mille cinq cents ans, un vide au cœur de la Grande Pyramide, une ville géante qui serait cachée sous les pyramides, et même un mur, au fond de la mer."}, {"t": "Et sur chaque indice, on va mettre un tampon : prouvé, débattu, ou non prouvé.", "jeu": "puis blanc de 1,5 s (le mage : « Et les tampons, c'est moi. »)"}], "groupe": "Face caméra (horizontal)", "info": "D'une traite. Aux blancs marqués, tu t'arrêtes le temps indiqué : le mage parle là."}, {"id": "em3-cam-4", "type": "texte", "titre": "4. Premier indice : les piliers", "morceaux": [{"t": "Donc ces piliers, ce sont en fait des personnages de pierre.", "jeu": "puis blanc de 2 s (le mage : « Mais alors, qui les a dressés ? »)"}, {"t": "Eh bien sur place, les archéologues trouvent surtout des plantes sauvages et des os d'animaux sauvages, mais pas de champs ni de troupeaux."}, {"t": "Ceux qui vivaient là étaient donc des chasseurs-cueilleurs."}, {"t": "Et c'est là que tout se complique, parce qu'on a longtemps cru qu'il fallait d'abord des champs pour avoir le temps de bâtir des monuments."}, {"t": "Or ici, les monuments semblent arriver avant les champs."}, {"t": "Alors pour les archéologues, ça montre que des chasseurs-cueilleurs savaient bâtir."}, {"t": "Mais pour Graham Hancock, ça montre justement que quelqu'un les a aidés."}, {"t": "C'est le même indice, avec deux lectures opposées.", "jeu": "puis blanc de 2 s (le mage : « Donc on ne sait pas ? »)"}, {"t": "Pas encore."}, {"t": "Mais il nous reste six indices."}], "groupe": "Face caméra (horizontal)", "info": "D'une traite. Aux blancs marqués, tu t'arrêtes le temps indiqué : le mage parle là."}, {"id": "em3-cam-5", "type": "texte", "titre": "5. Bienvenue", "morceaux": [{"t": "Et au passage, si tu viens d'arriver, bienvenue sur L'Émerveillement."}, {"t": "La chaîne démarre à peine, alors si tu aimes ce genre d'enquête, abonne-toi, et merci de ta confiance."}], "groupe": "Face caméra (horizontal)", "info": "D'une traite. Aux blancs marqués, tu t'arrêtes le temps indiqué : le mage parle là."}, {"id": "em3-cam-6", "type": "texte", "titre": "6. Deuxième indice : les tombes", "morceaux": [{"t": "Attention quand même : ces tombes ont été creusées au moins neuf cents ans après les premiers piliers."}, {"t": "Mais pour l'équipe qui fouille aujourd'hui, c'est clair : des gens ont vécu là du début à la fin de l'histoire du site, et ils y ont enterré leurs morts."}, {"t": "Donc le temple où presque personne ne vivait avait bel et bien des habitants."}, {"t": "Et pour notre duel, c'est un indice précieux, parce que pour la première fois, on a les squelettes intacts de ceux qui vivaient au pied des piliers."}, {"t": "Et ça, les deux camps vont devoir faire avec."}], "groupe": "Face caméra (horizontal)", "info": "D'une traite. Aux blancs marqués, tu t'arrêtes le temps indiqué : le mage parle là."}, {"id": "em3-cam-7", "type": "texte", "titre": "7. Troisième indice : la pierre au vautour", "morceaux": [{"t": "Seulement, dès 2017, les archéologues de Göbekli Tépé contestent par écrit la lecture de Sweatman."}, {"t": "Puis en 2023, une grande étude passe en revue tous les indices de cet impact, et ses auteurs concluent qu'il faut rejeter l'idée."}, {"t": "Mais le Comet Research Group leur répond l'année suivante, et il maintient son hypothèse."}, {"t": "Alors, un simple vautour sculpté, ou la plus vieille trace d'une catastrophe venue du ciel ?"}, {"t": "Pour l'instant, la pierre garde son secret."}], "groupe": "Face caméra (horizontal)", "info": "D'une traite. Aux blancs marqués, tu t'arrêtes le temps indiqué : le mage parle là."}, {"id": "em3-cam-8", "type": "texte", "titre": "8. Transition", "morceaux": [{"t": "Et le problème, c'est qu'à Göbekli Tépé, personne ne savait écrire."}, {"t": "On n'a donc que des pierres, des outils et des os."}, {"t": "Alors pour entendre enfin la voix de ceux qui construisaient, il faut avancer de sept mille ans, jusqu'en Égypte."}], "groupe": "Face caméra (horizontal)", "info": "D'une traite. Aux blancs marqués, tu t'arrêtes le temps indiqué : le mage parle là."}, {"id": "em3-cam-9", "type": "texte", "titre": "9. Quatrième indice : le carnet de Merer", "morceaux": [{"t": "Donc ce qu'on lit dans ces papyrus sur la Grande Pyramide, ce n'est ni un rituel ni un secret : c'est un journal de chantier.", "jeu": "puis blanc de 2 s (le mage : « Un journal de chantier ? Même pas un petit secret ? »)"}, {"t": "Alors, est-ce que c'est un point pour les archéologues ?"}, {"t": "Pas si vite, parce que ce carnet dit qui apportait une partie des pierres, mais il ne dit pas comment on a monté la pyramide."}], "groupe": "Face caméra (horizontal)", "info": "D'une traite. Aux blancs marqués, tu t'arrêtes le temps indiqué : le mage parle là."}, {"id": "em3-cam-10", "type": "texte", "titre": "10. Cinquième indice : le vide", "morceaux": [{"t": "Et ce vide, il est publié en 2017 dans l'une des plus grandes revues scientifiques."}, {"t": "Donc il existe, il est mesuré.", "jeu": "puis blanc de 2 s (le mage : « Un vide secret dans la pyramide ! Je le savais ! »)"}, {"t": "Mais à quoi il servait, et ce qu'il y a dedans, ça, personne ne le sait encore.", "jeu": "puis blanc de 2 s"}, {"t": "Alors forcément, un vide que personne n'explique, au cœur du monument le plus étudié du monde, c'est exactement le genre d'indice qui fait rêver le camp des mystères."}, {"t": "Et cette fois, il est bien réel.", "jeu": "puis blanc de 2 s"}], "groupe": "Face caméra (horizontal)", "info": "D'une traite. Aux blancs marqués, tu t'arrêtes le temps indiqué : le mage parle là."}, {"id": "em3-cam-11", "type": "texte", "titre": "11. Sixième indice : la ville sous les pyramides", "morceaux": [{"t": "Seulement, des spécialistes leur répondent que ce radar ne peut pas voir aussi profond dans la roche."}, {"t": "Et puis en août 2026, la revue qui avait publié leur article de 2022 le retire, à cause de graves erreurs de méthode."}, {"t": "Donc pour l'instant, aucune étude vérifiée ne montre cette ville.", "jeu": "puis blanc de 2 s"}, {"t": "Et c'est là que le dossier devient piégé, parce qu'un indice qui fait rêver n'est pas forcément un indice solide.", "jeu": "puis blanc de 2 s"}], "groupe": "Face caméra (horizontal)", "info": "D'une traite. Aux blancs marqués, tu t'arrêtes le temps indiqué : le mage parle là."}, {"id": "em3-cam-12", "type": "texte", "titre": "12. Le dernier argument", "morceaux": [{"t": "Eh bien la réponse de Hancock, depuis plus de vingt ans, c'est : sous la mer."}, {"t": "Parce qu'à la fin de l'ère glaciaire, la glace fond, la mer monte de plusieurs dizaines de mètres, et les côtes de l'époque disparaissent sous l'eau."}, {"t": "Et pour lui, c'est justement là que les archéologues n'ont presque jamais cherché."}, {"t": "Or en 2021, au fond de la mer Baltique, des chercheurs sont tombés sur quelque chose."}], "groupe": "Face caméra (horizontal)", "info": "D'une traite. Aux blancs marqués, tu t'arrêtes le temps indiqué : le mage parle là."}, {"id": "em3-cam-13", "type": "texte", "titre": "13. Septième et dernier indice : le mur sous la mer", "morceaux": [{"t": "Donc sous la mer, là où Hancock dit qu'il faut chercher, des chercheurs ont cherché."}, {"t": "Et ce qu'ils ont trouvé là, c'est un mur de chasseurs-cueilleurs, sans doute bâti pour guider des rennes."}, {"t": "Mais Hancock, lui, répond qu'on n'a exploré qu'une toute petite partie des côtes englouties."}], "groupe": "Face caméra (horizontal)", "info": "D'une traite. Aux blancs marqués, tu t'arrêtes le temps indiqué : le mage parle là."}, {"id": "em3-cam-14", "type": "texte", "titre": "14. La synthèse", "morceaux": [{"t": "Bon, on referme le dossier, et on fait le point."}, {"t": "Les piliers ont bien été dressés par des chasseurs-cueilleurs, il y a plus de onze mille ans, et les tombes montrent que des gens vivaient à leur pied."}, {"t": "Ça, c'est prouvé."}, {"t": "Par contre, la comète gravée sur la pierre au vautour reste débattue."}, {"t": "Puis en Égypte, le carnet de Merer montre que son équipe apportait des pierres à la Grande Pyramide, mais pas comment on l'a construite."}, {"t": "Et dans cette pyramide, grâce aux muons, ces particules qui tombent du ciel, on a bien repéré un grand vide, mais personne ne sait encore à quoi il servait."}, {"t": "Ensuite, la ville géante sous Khéphren, elle, n'est pas prouvée, parce que le radar utilisé ne voit pas aussi profond dans la roche, et que le premier article de ces chercheurs a été retiré."}, {"t": "Et sous la Baltique, le mur a sans doute été bâti par des chasseurs-cueilleurs."}, {"t": "Alors du coup, la civilisation perdue ?"}, {"t": "Eh bien pour l'instant, aucun de ces indices ne la montre."}], "groupe": "Face caméra (horizontal)", "info": "D'une traite. Aux blancs marqués, tu t'arrêtes le temps indiqué : le mage parle là."}, {"id": "em3-cam-15", "type": "texte", "titre": "15. La chute", "morceaux": [{"t": "Et tu te souviens de la toute première phrase ?"}, {"t": "Des gens qui n'avaient ni agriculture, ni troupeaux, ni écriture."}, {"t": "On les a décrits const $ = id => document.getElementById(id);

async function brancher() {
  try { db = await window.claude?.use?.("db"); } catch (_) { db = null; }
  if (!db) { $("sync").textContent = "Cases gardées sur cet appareil seulement."; return; }
  refEtat = db.doc("tournage/etat");
  $("sync").textContent = "Synchronisation…";
  const minuteur = setTimeout(() => { $("sync").className = "alerte"; $("sync").textContent = "Pas de réponse du serveur : les cases restent sur cet appareil pour l'instant."; }, 10000);
  refEtat.onSnapshot(s => {
    if (!s.metadata.fromCache) { clearTimeout(minuteur); $("sync").className = ""; $("sync").textContent = "Cases synchronisées entre tes appareils."; }
    if (s.exists && !s.metadata.hasPendingWrites && !enCours) { fait = { ...(s.data().fait || {}) }; garder("tg:fait", fait); rendre(); }
  }, () => { clearTimeout(minuteur); $("sync").className = "alerte"; $("sync").textContent = "Synchronisation coupée : les cases restent sur cet appareil."; db = null; });
}
async function ecrire() {
  garder("tg:fait", fait);

  enCours = refEtat.set({ fait: { ...fait } }).catch(() => { $("sync").className = "alerte"; $("sync").textContent = "La case n'a pas pu être enregistrée en ligne (elle reste sur cet appareil)."; });

}

function avancer(sens) {

$("scene").addEventListener("click", e => {

    else if (a === "suivant") { v++; m = 0; fini = false; afficher(); }

// ---------- Suivi de la voix (hors claude.ai : Safari sur iPhone, Chrome sur ordinateur), repris du prompteur Sauvons Les ----------
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "");

const proches = (a, b) => a === b || (a.length >= 4 && b.length >= 4 && (a.startsWith(b.slice(0, 4)) || b.startsWith(a.slice(0, 4))));

  $("etat").className = ""; $("etat").textContent = "J'entends : " + texte.trim().split(/\s+/).slice(-10).join(" ");
  const tout = motsDe(texte), h = tout.slice(Math.min(consommes, tout.length));
  dernierCompte = tout.length;
  if (fini || !cible.length) return;
  let k = 0;
  for (const w of h) if (k < cible.length && (proches(w, cible[k].n) || (k + 1 < cible.length && proches(w, cible[k + 1].n) && ++k))) k++;

function demarrerReco() {

function sansMicro() { $("etat").className = "alerte"; $("etat").textContent = "Le micro n'est pas disponible ici : touche l'écran pour passer à la phrase suivante (à gauche pour revenir)."; }

$("go").hidden = !Reco || /claude\.ai$/.test(location.hostname) || location.protocol === "about:";
$("go").addEventListener("click", basculer);

$("retour").addEventListener("click", fermer);
