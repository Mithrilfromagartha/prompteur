<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Tournage"><meta name="theme-color" content="#04121c"><style>[hidden]{display:none!important}</style></head><body><title>Tournage de la semaine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Archivo+Narrow:wght@500;700&display=swap">
<style>
  /* Liste de plateau : un onglet par compte, une ligne par prise à faire avec sa case ; le prompteur s'ouvre par-dessus, plein écran. Un seul thème sombre, voulu (lisible sur un iPhone posé sur le plateau, comme le prompteur Sauvons Les). */
  :root {
    --fond:#04121c; --panneau:#0b2433; --panneau2:#0f2d3f; --filet:#1d4255; --texte:#f4f7f8; --discret:#8fb0bd;
    --dit:#4f6f7c; --accent:#78e6dc; --fait:#7fd99a; --alerte:#ffb15c;
    --lecture:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
    --etiquette:"Archivo Narrow","Arial Narrow","Segoe UI",sans-serif;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--fond); color:var(--texte); font-family:var(--lecture); -webkit-text-size-adjust:100%; }
  body { font-size:16px; line-height:1.45; }
  button { font:inherit; color:inherit; cursor:pointer; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }

  #liste { max-width:760px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:18px 48px; display:flex; flex-direction:column; gap:18px; }
  .tete { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:26px; line-height:1.15; text-wrap:balance; }
  .total { font-family:var(--etiquette); color:var(--discret); font-variant-numeric:tabular-nums; letter-spacing:.03em; }
  .barre { height:6px; border-radius:3px; background:var(--panneau); overflow:hidden; }
  .barre i { display:block; height:100%; background:var(--fait); width:0; }
  @media (prefers-reduced-motion:no-preference) { .barre i { transition:width .3s; } }
  #sync { font-size:13px; color:var(--discret); min-height:1.2em; }
  #sync.alerte { color:var(--alerte); }

  #onglets { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
  .onglet { min-height:64px; padding:8px 10px; border:1px solid var(--filet); border-radius:10px; background:var(--panneau); text-align:left; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .onglet b { font-size:15px; overflow-wrap:anywhere; }
  .onglet span { font-family:var(--etiquette); font-size:13px; color:var(--discret); font-variant-numeric:tabular-nums; }
  .onglet[aria-selected="true"] { border-color:var(--accent); background:var(--panneau2); }
  .onglet[aria-selected="true"] b { color:var(--accent); }
  .onglet.complet span { color:var(--fait); }

  .sous { margin:0; color:var(--discret); }
  details.conseils { border:1px solid var(--filet); border-radius:10px; padding:10px 14px; background:var(--panneau); }
  details.conseils summary { cursor:pointer; font-family:var(--etiquette); font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:13px; color:var(--accent); }
  details.conseils ul { margin:10px 0 2px; padding-left:1.1em; display:flex; flex-direction:column; gap:6px; }

  .groupe { margin:6px 0 -6px; font-family:var(--etiquette); font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:13px; color:var(--discret); }
  .elements { display:flex; flex-direction:column; gap:10px; }
  .el { display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; padding:12px; border-top:1px solid var(--filet); }
  .el:first-child { border-top:0; }
  .case { width:44px; height:44px; border-radius:10px; border:2px solid var(--filet); background:transparent; display:grid; place-items:center; font-size:24px; font-weight:700; color:var(--fond); }
  .case[aria-pressed="true"] { background:var(--fait); border-color:var(--fait); }
  .corps { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .titre { font-weight:700; font-size:17px; text-wrap:balance; }
  .el.fait .titre { color:var(--discret); text-decoration:line-through; text-decoration-color:var(--dit); }
  .meta { font-family:var(--etiquette); font-size:13px; color:var(--discret); letter-spacing:.03em; font-variant-numeric:tabular-nums; }
  .info { margin:0; color:var(--texte); opacity:.88; }
  .note { margin:0; color:var(--alerte); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .lire { min-height:42px; padding:0 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--fond); font-weight:700; }
  .apercu { min-height:42px; padding:0 14px; border-radius:8px; border:1px solid var(--filet); background:var(--panneau); }
  .texte-entier { margin:0; padding:10px 12px; border-left:3px solid var(--filet); color:var(--discret); }
  .texte-entier mark { background:none; color:var(--accent); font-family:var(--etiquette); font-size:12px; letter-spacing:.05em; margin-right:.4em; }

  /* Prompteur : plein écran par-dessus la liste. */
  #prompteur { position:fixed; inset:0; z-index:5; background:var(--fond); display:flex; flex-direction:column;
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
    padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
  #prompteur[hidden] { display:none; }
  #haut { display:flex; align-items:center; gap:8px; padding-block:6px; font-size:15px; flex-wrap:wrap; }
  #haut button { min-height:40px; padding:0 12px; border:1px solid var(--filet); border-radius:8px; background:var(--panneau); }
  #ptitre { flex:1 1 10em; min-width:0; color:var(--discret); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #compte, #taille { color:var(--discret); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #taille { min-width:3.2em; text-align:center; }
  #scene { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:.5em; cursor:pointer; user-select:none; -webkit-user-select:none; padding-block:4px 10px; }
  #jeu { font-family:var(--etiquette); font-weight:700; letter-spacing:.06em; color:var(--alerte); font-size:clamp(14px, 3.4vh, 22px); min-height:1.2em; }
  #morceau { font-weight:700; line-height:1.18; text-wrap:balance; overflow-wrap:break-word; }
  #morceau .dit { color:var(--dit); }
  #haut #go { background:var(--accent); border-color:var(--accent); color:var(--fond); font-weight:700; }
  #etat { flex-basis:100%; color:var(--discret); font-size:13px; min-height:1.2em; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #etat.alerte { color:var(--alerte); }
  /* Micro actif : la barre disparaît pour laisser toute la place au texte ; un petit bouton reste pour arrêter. */
  body.joue #haut { display:none; }
  #stop { position:fixed; top:calc(6px + env(safe-area-inset-top, 0px)); right:max(10px, env(safe-area-inset-right, 0px)); min-height:34px; padding:0 10px; opacity:.45; font-size:14px; z-index:6; border:1px solid var(--filet); border-radius:8px; background:var(--panneau); }
  body:not(.joue) #stop { display:none; }
  #suite { color:var(--discret); font-size:clamp(14px, 3.2vh, 22px); line-height:1.3; }
  #suite b { color:var(--accent); font-weight:700; letter-spacing:.05em; font-size:.8em; margin-right:.5em; }
  #fin { display:flex; flex-direction:column; gap:14px; align-items:flex-start; }
  #fin p { margin:0; font-weight:700; font-size:clamp(22px, 6vh, 44px); color:var(--accent); }
  #fin .actions button { min-height:52px; padding:0 20px; font-size:18px; border-radius:10px; border:1px solid var(--filet); background:var(--panneau); }
  #fin .actions .marquer { background:var(--fait); border-color:var(--fait); color:var(--fond); font-weight:700; }
  body.sans-suite #suite { display:none; }
  body.prompteur-ouvert { overflow:hidden; }
</style>

  <div class="tete">
    <h1>Tournage de la semaine</h1>

<script>
const COMPTES = [{"id": "sauvons-les", "nom": "Sauvons Les", "sous": "Shorts face caméra · série du 2 décembre", "conseils": ["Filme plus large, en 4K : je recadre au montage (ta tête en bas de l'image, comme Abrège).", "Lumière de face. Garde le fichier d'origine du téléphone, pas un envoi par WhatsApp.", "Les mots « mort », « tuer »… : dis-les normalement, le montage les bipe."], "items": [{"id": "sl-1", "type": "texte", "titre": "Les orques d'Antibes (pilote)", "morceaux": [{"t": "Ces deux orques vivent seules dans un parc fermé depuis presque deux ans."}, {"t": "Et leur voisin, le dauphin Rocky, est mort cet automne, moins de trois mois après son départ en Espagne."}, {"t": "Oui frérot, le Marineland d'Antibes a fermé, mais la maman et son fils sont restés là."}, {"t": "Et téma le plan drone, de l'eau verte, de la rouille partout, on dirait The Last of Us."}, {"t": "Mais le pire, c'est que le gouvernement veut les envoyer en Espagne, dans un parc qui fait encore des spectacles."}, {"t": "Abonne-toi, à mille abonnés je partage la pétition qui demande un sanctuaire pour elles, pas un autre bassin."}, {"t": "Parce que finir leur vie en spectacle, franchement, tu trouves ça normal ?"}], "info": "Une seule prise, face caméra, d'une traite.", "note": ""}, {"id": "sl-2", "type": "texte", "titre": "Ce qui change le 2 décembre", "morceaux": [{"t": "Le 2 décembre, en France, garder un dauphin dans un bassin, ce sera interdit, sauf qu'il y a un piège, genre « It's a trap »."}, {"t": "Et ouais frérot, c'est une vraie loi, votée il y a cinq ans, et elle dit stop aux spectacles et stop aux bébés nés en bassin."}, {"t": "Du coup, les parcs ont eu cinq ans pour trouver une solution."}, {"t": "Sauf que le jour arrive, et y a deux orques à Antibes et onze dauphins près de Nantes qui savent pas où ils vont finir."}, {"t": "Et le piège, je te le montre lundi."}, {"t": "Abonne-toi, à mille abonnés je partage la pétition qui demande un sanctuaire pour ces orques et ces dauphins."}, {"t": "Parce qu'une loi avec un piège dedans, tu lui fais confiance, toi ?"}], "info": "Une seule prise, face caméra, d'une traite.", "note": "« Et le piège, je te le montre lundi » : dis le jour où sortira la vidéo du piège (« demain » si elle sort le lendemain)."}, {"id": "sl-3", "type": "texte", "titre": "Les 11 dauphins près de Nantes", "morceaux": [{"t": "Ces onze dauphins devaient déménager, et maintenant, ils ont plus nulle part où aller, comme Tom Hanks dans Le Terminal."}, {"t": "Ils vivent dans un parc près de Nantes, et comme la loi arrive, le zoo de Beauval avait promis de les prendre."}, {"t": "Sauf que fin août, Beauval a lâché l'affaire, parce que ça coûtait beaucoup trop cher."}, {"t": "Du coup, retour à la case départ."}, {"t": "Et le pire, c'est qu'une asso dit qu'ils vont finir à l'autre bout du monde, en Asie, sauf que pour l'instant, rien n'est confirmé."}, {"t": "Si t'as le seum, abonne-toi, à mille abonnés on partage la pétition qui veut les envoyer dans un sanctuaire en Italie."}, {"t": "Et toi, plutôt l'Asie ou un sanctuaire, tu les enverrais où ?"}], "info": "Une seule prise, face caméra, d'une traite.", "note": ""}, {"id": "sl-4", "type": "texte", "titre": "Le piège de la science", "morceaux": [{"t": "Comme promis, la loi qui interdit les dauphins en bassin a un piège, et ce piège, c'est la science."}, {"t": "Si un parc dit qu'il fait de la recherche, il a le droit de garder ses dauphins et même de leur faire faire des bébés, comme une carte sortie de prison."}, {"t": "Sauf que personne a encore écrit ce que c'est, de la vraie recherche."}, {"t": "Et le pire, c'est que le parc près de Nantes, avec ses onze dauphins, disait en 2023 que c'était son cas."}, {"t": "Abonne-toi, à mille abonnés je partage la pétition qui demande un sanctuaire pour ces dauphins, pas un bassin."}, {"t": "Alors pour toi, ces recherches, c'est de la vraie science ou une grosse excuse ?"}], "info": "Une seule prise, face caméra, d'une traite.", "note": ""}, {"id": "sl-5", "type": "texte", "titre": "Rocky, transféré de nuit", "morceaux": [{"t": "Ce dauphin est parti en pleine nuit, et moins de trois mois après, il était mort."}, {"t": "Il s'appelait Rocky, comme le boxeur, il avait vingt-neuf ans, et il vivait à Antibes, dans un parc fermé."}, {"t": "Du coup, en juillet, on l'a mis dans un camion puis dans un avion pour l'Espagne, avec sept autres dauphins, en plein été."}, {"t": "Sauf qu'une asso avait prévenu qu'un voyage comme ça, l'été, ça peut tuer."}, {"t": "Et en octobre, Rocky meurt, et depuis, aucune explication, silence radio."}, {"t": "Si ça te met la rage, abonne-toi, à mille abonnés je mets en bio la pétition qui demande plus aucun transfert vers un parc."}, {"t": "Et pour Rocky, tu penses que quelqu'un doit payer ?"}], "info": "Une seule prise, face caméra, d'une traite.", "note": ""}, {"id": "sl-6", "type": "texte", "titre": "Le parc de Tenerife", "morceaux": [{"t": "Le gouvernement veut envoyer nos deux dernières orques dans un parc où quatre orques sont mortes en quatre ans."}, {"t": "Elles s'appellent Wikie et Keijo, une maman et son fils, et elles sont toutes seules dans un parc fermé."}, {"t": "Ce nouveau parc, il est à Tenerife, en Espagne, et là-bas, téma, y a encore des spectacles d'orques, genre Free Willy à l'envers."}, {"t": "Et le plus fou, c'est que les scientifiques espagnols avaient déjà dit non, à cause des bassins trop petits."}, {"t": "Et pourtant, le ministre dit que c'est la meilleure solution."}, {"t": "Chaque abonné compte, à mille abonnés je mets en bio la pétition contre leur départ en Espagne."}, {"t": "Et toi, si t'étais ministre, tu les envoies à Tenerife, oui ou non ?"}], "info": "Une seule prise, face caméra, d'une traite.", "note": ""}]}, {"id": "plan-culte", "nom": "Plan Culte", "sous": "Pilote · « t'as forcément plus de 35 ans »", "conseils": ["Vertical 9:16, en 4K si possible, objectif à hauteur des yeux, regard dans l'objectif.", "Tenue différente de celle d'Ezra : les deux chaînes ne doivent pas se ressembler.", "Lumière face à toi, pièce calme, micro près de la bouche. Si tu butes : 1 s de silence, puis la phrase entière."], "items": [{"id": "pc-taram", "type": "texte", "titre": "Pilote · Taram et le Chaudron magique", "morceaux": [{"t": "T'as forcément plus de 35 ans si tu connais Taram et le Chaudron magique.", "jeu": "VISAGE · direct, petit sourire de défi"}, {"t": "Et je sais de quoi je parle : je suis né en juillet 1807, le jour où Napoléon s'est fait attaquer par des lapins.", "jeu": "VISAGE · pince-sans-rire, très sérieux, sans sourire"}, {"t": "Et si tu l'as vu au cinéma, t'as vu un Disney charcuté avant sa sortie, parce qu'il faisait trop peur."}, {"t": "Faut dire que le méchant, c'est le Seigneur des Ténèbres, un squelette à cornes, genre le cousin de Skeletor dans Musclor."}, {"t": "Et lui, il veut réveiller une armée de morts avec un chaudron magique."}, {"t": "Du coup, quand le studio le projette en test, l'armée des morts est trop dure pour les enfants dans la salle."}, {"t": "Alors le nouveau patron du studio, Jeffrey Katzenberg, ordonne de couper, et il se met même à monter le film tout seul, jusqu'à ce que son boss, Michael Eisner, l'arrête."}, {"t": "Au final, une dizaine de minutes disparaissent, dont des morceaux de la scène où l'armée des morts sort du chaudron."}, {"t": "Et même charcuté, ça reste le premier dessin animé Disney classé « accord parental conseillé » aux États-Unis.", "jeu": "VISAGE · un peu fier du film, comme si tu le défendais"}, {"t": "Et en France, plus de trois millions d'entrées."}, {"t": "Mais aux États-Unis, c'est un flop, battu même par Les Bisounours, le film."}, {"t": "À cette époque, chez Disney, les patrons parlent même de fermer le département animation."}, {"t": "Et tu sais quoi ?", "jeu": "VISAGE · tu te penches vers l'objectif, la question monte"}, {"t": "Les coupes sont tellement mal faites qu'on les entend encore : la musique saute, et une cymbale s'arrête net, en plein coup."}, {"t": const $ = id => document.getElementById(id);

}
async function ecrire() {

// ---------- Liste ----------
let actif = Math.max(0, COMPTES.findIndex(c => "#" + c.id === location.hash));

    return `<button class="onglet${f === N ? " complet" : ""}" role="tab" id="tab-${c.id}" aria-selected="${k === actif}" data-k="${k}"><b>${esc(c.nom)}</b><span>${f === N ? "✓ tout fait" : `${f} / ${N} faits`}</span></button>`;
  }).join("");

  let groupe = null;
  html += `<div class="elements" role="tabpanel" aria-labelledby="tab-${c.id}">`;
  c.items.forEach(it => {
    if ((it.groupe || null) !== groupe) { groupe = it.groupe || null; if (groupe) html += `<div class="groupe">Plans en plus · ${esc(groupe)}</div>`; }
    const ok = !!fait[it.id];
    let meta = it.type === "texte" ? `TEXTE · ${it.morceaux.length} phrases · ${nbMots(it)} mots · ≈ ${Math.round(nbMots(it) / 3)} s` : "PLAN À FILMER";
    html += `<div class="el${ok ? " fait" : ""}">
      <button class="case" type="button" aria-pressed="${ok}" aria-label="${ok ? "Fait" : "Pas fait"} : ${esc(it.titre)}" data-id="${it.id}">${ok ? "✓" : ""}</button>

        ${it.type === "texte" ? `<div class="actions"><button class="lire" type="button" data-lire="${it.id}">Lire au prompteur ▶</button><button class="apercu" type="button" data-voir="${it.id}">${ouverts.has(it.id) ? "Cacher le texte" : "Voir le texte"}</button></div>` : ""}
        ${it.type === "texte" && ouverts.has(it.id) ? `<p class="texte-entier">${it.morceaux.map(m => (m.jeu ? `<mark>[${esc(m.jeu.split(" · ")[0])}]</mark>` : "") + esc(m.t)).join(" ")}</p>` : ""}
      </div></div>`;
  });

}
const ouverts = new Set();

$("onglets").addEventListener("click", e => { const b = e.target.closest(".onglet"); if (!b) return; actif = +b.dataset.k; history.replaceState(null, "", "#" + COMPTES[actif].id); rendre(); });
$("vue").addEventListener("click", e => {
  const c = e.target.closest(".case"); if (c) return basculerFait(c.dataset.id);
  const l = e.target.closest("[data-lire]"); if (l) return ouvrir(l.dataset.lire);
  const v = e.target.closest("[data-voir]"); if (v) { ouverts.has(v.dataset.voir) ? ouverts.delete(v.dataset.voir) : ouverts.add(v.dataset.voir); rendre(); }
});
$("vue").addEventListener("toggle", e => { if (e.target.matches("details.conseils")) garder("tg:conseils:" + COMPTES[actif].id, e.target.open); }, true);
window.addEventListener("hashchange", () => { const k = COMPTES.findIndex(c => "#" + c.id === location.hash); if (k >= 0) { actif = k; rendre(); } });

// ---------- Prompteur (une phrase entière par écran, toucher à droite = suite, tiers gauche = retour) ----------
let textes = [], v = 0, m = 0, fini = false, veille = null;
const TAILLES = [50, 60, 70, 80, 90, 100, 110];
let t = TAILLES.indexOf(lire("tg:taille", 100)); if (t < 0) t = 5;

function ouvrir(id) {
  textes = COMPTES[actif].items.filter(it => it.type === "texte");
  v = Math.max(0, textes.findIndex(it => it.id === id)); m = 0; fini = false;
  $("prompteur").hidden = false; document.body.classList.add("prompteur-ouvert");

}
function fermer() { arreter(); $("prompteur").hidden = true; document.body.classList.remove("prompteur-ouvert"); if (veille) { veille.release().catch(() => {}); veille = null; } rendre(); }
async function garderEveille() { try { if (navigator.wakeLock) veille = await navigator.wakeLock.request("screen"); } catch (_) { veille = null; } }

  const el = $("morceau"), sc = $("scene");
  if ($("prompteur").hidden) return;
  if (fini) { el.style.fontSize = ""; return; }
  let hi = 200, lo = 16;
  while (hi - lo > 1) {
    const x = (hi + lo) >> 1; el.style.fontSize = x + "px";
    const place = sc.clientHeight - $("suite").offsetHeight - $("jeu").offsetHeight - 28;
    if (el.scrollHeight <= place && el.scrollWidth <= sc.clientWidth) lo = x; else hi = x;

}
function poserTaille(k) {
  t = Math.max(0, Math.min(TAILLES.length - 1, k));
  document.body.classList.toggle("sans-suite", TAILLES[t] > 100);
  $("taille").textContent = TAILLES[t] > 100 ? "max +" : TAILLES[t] + " %";
  garder("tg:taille", TAILLES[t]); ajuster();
}
function afficher() {
  const T = textes[v], el = $("morceau");
  $("ptitre").textContent = T.titre;
  if (fini) {
    const ok = !!fait[T.id], ensuite = textes[v + 1];
    $("jeu").textContent = ""; $("compte").textContent = "";
    el.innerHTML = `<div id="fin"><p>Texte fini.</p><div class="actions">
      <button class="marquer" type="button" data-fin="marquer">${ok ? "✓ Marqué fait" : "Marquer fait ✓"}</button>
      ${ensuite ? `<button type="button" data-fin="suivant">Texte suivant · ${esc(ensuite.titre)}</button>` : ""}
      <button type="button" data-fin="debut">Recommencer</button>
      <button type="button" data-fin="liste">Retour à la liste</button></div></div>`;
    $("suite").innerHTML = ""; return;
  }
  const M = T.morceaux[m];
  $("jeu").textContent = M.jeu || "";
  el.innerHTML = ""; cible = []; vus = 0;
  M.t.split(" ").forEach(w => { const s = document.createElement("span"); s.textContent = w + " "; el.appendChild(s); if (norm(w)) cible.push({ n: norm(w), el: s }); });
  const apres = T.morceaux[m + 1];
  $("suite").innerHTML = apres ? `<b>ENSUITE</b>${esc(apres.t.split(" ").slice(0, 8).join(" "))}…` : "<b>FIN</b>c'est la dernière phrase du texte";
  $("compte").textContent = `${m + 1} / ${T.morceaux.length}`;
  ajuster();
}
function avancer(sens) {
  const T = textes[v];
  if (fini) { if (sens < 0) { fini = false; m = T.morceaux.length - 1; } }
  else if (sens > 0) { if (m < T.morceaux.length - 1) m++; else fini = true; }
  else if (m > 0) m--;
  afficher();
}
$("scene").addEventListener("click", e => {
  const b = e.target.closest("[data-fin]");
  if (b) {
    const a = b.dataset.fin;
    if (a === "marquer") { basculerFait(textes[v].id, true); afficher(); }
    else if (a === "suivant") { v++; m = 0; fini = false; afficher(); }
    else if (a === "debut") { m = 0; fini = false; afficher(); }
    else fermer();

  if (fini) return;

});
// ---------- Suivi de la voix (hors claude.ai : Safari sur iPhone, Chrome sur ordinateur), repris du prompteur Sauvons Les ----------
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "");
const motsDe = s => s.split(/\s+/).map(norm).filter(Boolean);
const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;

let piste = null, ecoute = false, rec = null, base = 0, cible = [], vus = 0, consommes = 0, dernierCompte = 0, attente = null;
const proches = (a, b) => a === b || (a.length >= 4 && b.length >= 4 && (a.startsWith(b.slice(0, 4)) || b.startsWith(a.slice(0, 4))));
function entendu(texte, final) {
  $("etat").className = ""; $("etat").textContent = "J'entends : " + texte.trim().split(/\s+/).slice(-10).join(" ");
  const tout = motsDe(texte), h = tout.slice(Math.min(consommes, tout.length));
  dernierCompte = tout.length;
  if (fini || !cible.length) return;

  vus = Math.max(vus, k);
  cible.forEach((c, j) => c.el.classList.toggle("dit", j < vus));
  const part = vus / cible.length, finDite = h.slice(-3).some(w => proches(w, cible[cible.length - 1].n));
  if ((part >= 0.7 && finDite) || part >= 0.9 || (final && part >= 0.5)) {
    if (attente) return;
    consommes = dernierCompte;

function demarrerReco() {

    for (let j = base; j < e.results.length; j++) { tx += " " + e.results[j][0].transcript; final = e.results[j].isFinal; }

    if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) { arreter(); sansMicro(); }

  };
  r.onend = () => { if (ecoute && r === rec) setTimeout(() => { if (ecoute && r === rec) demarrerReco(); }, 150); };

}
function sansMicro() { $("etat").className = "alerte"; $("etat").textContent = "Le micro n'est pas disponible ici : touche l'écran pour passer à la phrase suivante (à gauche pour revenir)."; }
function arreter() {
  if (piste) { piste.stop(); piste = null; }
  ecoute = false; const r = rec; rec = null; if (r) try { r.stop(); } catch (_) {}

  $("go").textContent = "Écouter ma voix";
}
async function basculer() {
  if (ecoute) { arreter(); $("etat").textContent = ""; return; }
  if (!Reco) { sansMicro(); return; }
  ecoute = true; document.body.classList.add("joue"); ajuster();
  $("etat").className = ""; $("etat").textContent = "J'écoute : lis la phrase à voix haute";
  if (!SAFARI && navigator.mediaDevices) {
    try { const f = await navigator.mediaDevices.getUserMedia({ audio: true }); if (!ecoute) { f.getTracks().forEach(x => x.stop()); return; } piste = f.getAudioTracks()[0]; }
    catch (_) { arreter(); sansMicro(); return; }
  }
  demarrerReco();

$("go").hidden = !Reco || /claude\.ai$/.test(location.hostname) || location.protocol === "about:";
$("go").addEventListener("click", basculer);

$("retour").addEventListener("click", fermer);
$("prec").addEventListener("click", () => avancer(-1));
$("suiv").addEventListener("click", () => avancer(1));
$("petit").addEventListener("click", () => poserTaille(t - 1));
$("grand").addEventListener("click", () => poserTaille(t + 1));
document.addEventListener("keydown", e => {
  if ($("prompteur").hidden) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); avancer(1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") avancer(-1);
  else if (e.key === "Escape") fermer();
  else if (e.key === "+" || e.key === "=") poserTaille(t + 1);
  else if (e.key === "-") poserTaille(t - 1);
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("prompteur").hidden) garderEveille(); });
window.addEventListener("resize", ajuster);
if (document.fonts) document.fonts.ready.then(ajuster);

rendre();
